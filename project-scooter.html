    .page-section{max-width:var(--content);margin:0 auto;padding:clamp(48px,5.2vw,84px) 0}
    .js .page-section{opacity:0;transform:translateY(24px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
    .page-section:first-child{padding-top:0}
    .page-section+.page-section{border-top:1px solid var(--line)}
    .js .page-section.visible{opacity:1;transform:none}
    .page-section figure{margin:0}
    .page-section img{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 12px 36px rgba(45,45,60,.045)}

    .project-end{display:flex;justify-content:space-between;align-items:center;max-width:var(--content);margin:0 auto;padding-top:32px;border-top:1px solid var(--line)}
    .project-end a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;letter-spacing:.08em}
    .project-end span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}

    @media(max-width:760px){

      .project-end{align-items:flex-start;flex-direction:column;gap:24px}

    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.back-home,.project-head img,.page-section,body{transition:none}.project-head::before{animation:none}.js .page-section{opacity:1;transform:none}}
  figcaption>span:last-child{flex-shrink:0;white-space:nowrap}figcaption>span:first-child{line-height:1.6}.head-media figcaption{padding-bottom:16px}@media(max-width:760px){figcaption{gap:12px;font-size:10px}}
  </style>
</head>

  <script>
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove('page-entering')));
    const sections=[...document.querySelectorAll('.page-section')];
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){
      sections.forEach(section=>section.classList.add('visible'));
    }else{
      const observer=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting){
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },{threshold:.08,rootMargin:'0px 0px -8% 0px'});
      sections.forEach(section=>observer.observe(section));
    }
  </script>
